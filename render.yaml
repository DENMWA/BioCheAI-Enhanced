services:
  - type: web
    name: biocheai-backend
    env: python
    plan: starter
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: biocheai-redis
          property: connectionString
    healthCheckPath: /api/health
    
  - type: web
    name: biocheai-frontend
    runtime: static
    plan: starter
    buildCommand: cd biocheai-frontend && npm ci && npm run build
    staticPublishPath: biocheai-frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: biocheai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_WEBSOCKET_URL
        fromService:
          type: web
          name: biocheai-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: redis
    name: biocheai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all connections

databases:
  - name: biocheai-db
    plan: free
